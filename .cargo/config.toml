# Used only for builds started from inside this superproject.
# Standalone builds of a submodule (CI) do not read it.

# Faster local builds: sccache caches compiled crates, mold links. Dev only:
# ci-local.sh and release-local.sh build outside the superproject with a clean
# environment, exactly like the runners, so they use neither.
# Fedora: sudo dnf install mold sccache.
[build]
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[net]
# Private git dependencies are fetched with the git CLI so that the SSH agent
# and the credential helpers are honoured.
git-fetch-with-cli = true

# Local path overrides: builds inside the superproject use the working trees of
# the submodules instead of the git revisions pinned by the consumers.
[patch."https://github.com/dnviti-personal-org/dentalcraft-core.git"]
dc-mesh = { path = "dentalcraft-core/crates/dc-mesh" }
dc-geom = { path = "dentalcraft-core/crates/dc-geom" }
dc-case = { path = "dentalcraft-core/crates/dc-case" }
dc-command = { path = "dentalcraft-core/crates/dc-command" }
dc-jobs = { path = "dentalcraft-core/crates/dc-jobs" }
dc-scene = { path = "dentalcraft-core/crates/dc-scene" }
dc-project = { path = "dentalcraft-core/crates/dc-project" }
dc-module-api = { path = "dentalcraft-core/crates/dc-module-api" }
dc-i18n = { path = "dentalcraft-core/crates/dc-i18n" }
dc-theme = { path = "dentalcraft-core/crates/dc-theme" }
dc-session = { path = "dentalcraft-core/crates/dc-session" }
dc-mcp = { path = "dentalcraft-core/crates/dc-mcp" }
dc-raster = { path = "dentalcraft-core/crates/dc-raster" }
dc-scanner = { path = "dentalcraft-core/crates/dc-scanner" }
dc-ble = { path = "dentalcraft-core/crates/dc-ble" }
dc-turntable = { path = "dentalcraft-core/crates/dc-turntable" }

[patch."https://github.com/dnviti-personal-org/dentalcraft-aligners.git"]
dca-model = { path = "dentalcraft-aligners/crates/dca-model" }
dca-algo = { path = "dentalcraft-aligners/crates/dca-algo" }
dca-module = { path = "dentalcraft-aligners/crates/dca-module" }
